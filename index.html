<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Removed | Mohak Choubey</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f3f4f6;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Orbs */
        .bg-glow-1 {
            position: fixed;
            top: 20%;
            left: 20%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, transparent 70%);
            filter: blur(60px);
            z-index: 1;
            animation: pulse 8s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: 20%;
            right: 20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            filter: blur(80px);
            z-index: 1;
            animation: pulse 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -20px); }
        }

        /* Glassmorphic Container Card */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 56px 40px;
            max-width: 580px;
            width: 90%;
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Favicon Logo Display */
        .page-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 24px;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 30%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            margin-bottom: 32px;
        }

        /* CTA Section */
        .cta-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 320px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.4);
            background: linear-gradient(135deg, #a78bfa, #818cf8);
        }

        .btn span {
            transition: transform 0.2s ease;
        }

        .btn:hover span {
            transform: translateX(4px);
        }

        .footer {
            margin-top: 36px;
            font-size: 13px;
            color: #6b7280;
        }

        @media (max-width: 480px) {
            .container {
                padding: 40px 24px;
            }

            h1 {
                font-size: 22px;
            }

            .page-logo {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <!-- Displaying your favicon.png -->
        <img src="favicon.png" alt="Logo" class="page-logo">
        
        <h1>The website of pinyk bakery has been unpublished due to some reasons</h1>
        <p class="subtitle">thanks for visiting</p>

        <div class="divider"></div>

        <div class="cta-section">
            <a href="https://mohakchoubey.github.io" class="btn">
                Visit my other projects : mohakchoubey.github.io <span>&rarr;</span>
            </a>
        </div>

        <div class="footer">
            @ <span id="year"></span> mohak choubey
        </div>
    </div>

    <script>
        // Logic to automatically set the current year dynamically
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
